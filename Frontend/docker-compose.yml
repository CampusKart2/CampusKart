services:
  campuskart:
    # Run with --env-file .env.local so these build args resolve.
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/campuskart}
        NEXT_PUBLIC_GETSTREAM_API_KEY: ${NEXT_PUBLIC_GETSTREAM_API_KEY:-}
    container_name: campuskart-container
    ports:
      - "127.0.0.1:3002:3000"

    env_file:
      - .env.local
    environment:
      SERVER_INTERNAL_APP_URL: http://127.0.0.1:3000

    restart: unless-stopped
